name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v19

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - run: nix develop -c cargo test

  verify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v19

      - name: Verify tag matches Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO="$(nix develop -c cargo pkgid -q | sed 's/.*#//')"
          if [ "$TAG" != "$CARGO" ]; then
            echo "Tag v$TAG does not match Cargo.toml version $CARGO"
            exit 1
          fi

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_id: x86_64-linux
          - os: macos-latest
            platform_id: aarch64-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v19

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - run: nix build .#default --print-build-logs

      - name: Package release archive
        shell: bash
        run: |
          VERSION="$(nix develop -c cargo pkgid -q | sed 's/.*#//')"
          NAME="league-bot-${VERSION}-${{ matrix.platform_id }}"
          mkdir dist
          cp result/bin/league-bot dist/
          cp .env.example dist/
          tar -czf "${NAME}.tar.gz" -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform_id }}
          path: league-bot-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: assets/*
