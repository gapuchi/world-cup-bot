[package]
name = "league-bot"
version = "0.2.3"
edition = "2024"
publish = false

[dependencies]
dotenvy = "0.15"
poise = "0.6"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
